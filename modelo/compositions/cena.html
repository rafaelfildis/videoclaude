<template>
  <!--
    Cena-modelo do padrão da série. Tudo o que aparece aqui é exemplo:
    - a moldura (#mc-tela) recebe a gravação recortada (troque o <img> por <video>, veja o README);
    - títulos "Etapa N de M" + barra de progresso, ou selo "Marca · seção";
    - câmera (zoom em regiões da tela), foco laranja e clique;
    - destaques na base da moldura, com itens que acendem na palavra falada;
    - cartão-resumo no fim.
    Tempos locais: a cena começa em 4,5 s no vídeo final (index.html).
  -->
  <style>
    @font-face { font-family: "Jost"; src: url("assets/fonts/Jost.woff2") format("woff2"); font-weight: 300 700; }
    #root { position: absolute; inset: 0; font-family: "Jost", sans-serif; color: #e6f0ff; }
    #mc-cena { position: absolute; inset: 0; }
    #mc-veu { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 45%, rgba(4,9,22,.6), rgba(4,9,22,.9)); }
    /* selo de título no topo à esquerda */
    .mc-tit { position: absolute; left: 160px; top: 14px; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 0;
      background: #08122a; color: #ffffff; border-radius: 12px; overflow: hidden; font-size: 34px; font-weight: 600; opacity: 0; }
    .mc-tit b { height: 64px; padding: 0 20px; display: flex; align-items: center; background: #ffb020; color: #1a1205; font-weight: 700; }
    .mc-tit.marca b { background: #4fd1ff; color: #071226; }
    /* barra de progresso no topo à direita */
    #mc-prog { position: absolute; right: 160px; top: 18px; height: 56px; padding: 0 16px; border-radius: 28px; background: rgba(8,18,42,.94);
      border: 2px solid rgba(79,209,255,.5); display: flex; align-items: center; opacity: 0; }
    .mc-p { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(79,209,255,.5); display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: rgba(230,240,255,.55); background: #08122a; }
    .mc-l { width: 18px; height: 3px; background: rgba(79,209,255,.35); }
    /* moldura: 1600 px de largura; a gravação 1920×994 entra com escala 1600/1920 */
    #mc-tela { position: absolute; left: 160px; top: 92px; width: 1600px; height: 828px; overflow: hidden; border-radius: 16px; background: #dfe3ea;
      border: 2px solid rgba(79,209,255,.85); box-shadow: 0 0 50px rgba(79,209,255,.3), 0 30px 60px rgba(0,0,0,.5); }
    #mc-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 994px; transform-origin: 0 0; }
    #mc-midia { position: absolute; left: 0; top: 0; width: 1920px; height: 994px; }
    .mc-foco { position: absolute; border-radius: 8px; border: 4px solid #ffb020; box-shadow: 0 0 0 3000px rgba(6,14,34,.35), 0 0 18px rgba(255,176,32,.9); opacity: 0; }
    .mc-clique { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 5px solid #ffb020; opacity: 0; }
    .mc-rot { position: absolute; left: 30px; bottom: 26px; padding: 14px 24px; border-radius: 14px; background: rgba(8,18,42,.96); border: 2px solid #4fd1ff;
      font-size: 32px; font-weight: 600; box-shadow: 0 0 24px rgba(79,209,255,.45), 0 10px 30px rgba(0,0,0,.5); display: flex; align-items: center; gap: 12px; opacity: 0; }
    .mc-rot i { font-style: normal; padding: 4px 14px; border-radius: 8px; font-size: 28px; font-weight: 600; background: rgba(79,209,255,.14);
      border: 2px solid rgba(79,209,255,.45); color: #cfe9ff; opacity: 0.25; white-space: nowrap; }
    #mc-fonte { position: absolute; right: 18px; bottom: 16px; padding: 6px 16px; border-radius: 10px; background: rgba(8,18,42,.88); font-size: 28px; color: #cfe2ff; }
    /* cartão-resumo */
    #mc-resumo { position: absolute; inset: 0; opacity: 0; }
    #mc-resumo h2 { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 56px; font-weight: 700; color: #ffffff; }
    #mc-resumo h2 em { font-style: normal; color: #4fd1ff; }
    #mc-cards { position: absolute; left: 160px; right: 160px; top: 290px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .mc-c { height: 430px; border-radius: 26px; background: rgba(8,18,42,.95); border: 3px solid #4fd1ff; padding: 36px 32px; box-shadow: 0 20px 50px rgba(0,0,0,.5); opacity: 0; }
    .mc-c .n { font-size: 30px; font-weight: 700; color: #4fd1ff; }
    .mc-c b { display: block; font-size: 52px; font-weight: 700; margin: 16px 0 18px; color: #ffffff; }
    .mc-c span { font-size: 32px; color: #dfe9ff; line-height: 1.25; }
  </style>
  <div id="root" data-composition-id="cena" data-width="1920" data-height="1080">
    <div id="mc-cena" data-layout-allow-overlap data-layout-allow-occlusion>
      <div id="mc-veu" data-layout-ignore></div>
      <div class="mc-tit" id="mc-t1" data-layout-allow-occlusion><b>Etapa 1 de 3</b>Nome da etapa</div>
      <div class="mc-tit" id="mc-t2" data-layout-allow-occlusion><b>Etapa 2 de 3</b>Nome da etapa</div>
      <div class="mc-tit marca" id="mc-t3" data-layout-allow-occlusion><b>Marca</b>Seção do vídeo</div>
      <div id="mc-prog" data-layout-allow-occlusion>
        <div class="mc-p" id="mc-p1">1</div><div class="mc-l"></div><div class="mc-p" id="mc-p2">2</div><div class="mc-l"></div><div class="mc-p" id="mc-p3">3</div>
      </div>
      <div id="mc-tela">
        <div id="mc-cam" data-layout-allow-overflow>
          <!-- troque por: <video id="mc-midia" class="clip" src="assets/trechos/gravacao.mp4" data-start="0" data-duration="19.3" data-track-index="1" muted playsinline></video> -->
          <img id="mc-midia" src="assets/exemplo/tela.svg" alt="Tela de exemplo" />
          <!-- foco e clique usam coordenadas da gravação (1920×994) -->
          <div class="mc-foco" id="mc-f1" style="left: 344px; top: 105px; width: 360px; height: 52px"></div>
          <div class="mc-clique" id="mc-c1" style="left: 430px; top: 131px"></div>
          <div class="mc-foco" id="mc-f2" style="left: 364px; top: 354px; width: 1002px; height: 66px"></div>
          <div class="mc-foco" id="mc-f3" style="left: 1234px; top: 604px; width: 132px; height: 66px"></div>
          <div class="mc-clique" id="mc-c2" style="left: 1300px; top: 637px"></div>
        </div>
        <div class="mc-rot" id="mc-r1" data-layout-allow-occlusion>Destaque:<i>Item 1</i><i>Item 2</i><i>Item 3</i></div>
        <div class="mc-rot" id="mc-r2" data-layout-allow-occlusion><i>Campo 1</i><i>Campo 2</i><i>Enviar</i></div>
        <div id="mc-fonte" data-layout-allow-occlusion>Gravação do sistema</div>
      </div>
      <div id="mc-resumo" data-layout-allow-overlap data-layout-allow-occlusion>
        <h2 data-layout-allow-occlusion>Frase de resumo com <em>destaque</em></h2>
        <div id="mc-cards">
          <div class="mc-c" id="mc-k1" data-layout-allow-occlusion><div class="n">01</div><b>Ponto 1</b><span>Uma linha explicando o primeiro ponto</span></div>
          <div class="mc-c" id="mc-k2" data-layout-allow-occlusion><div class="n">02</div><b>Ponto 2</b><span>Uma linha explicando o segundo ponto</span></div>
          <div class="mc-c" id="mc-k3" data-layout-allow-occlusion><div class="n">03</div><b>Ponto 3</b><span>Uma linha explicando o terceiro ponto</span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mc-veu", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
      tl.fromTo("#mc-tela", { opacity: 0, y: 24, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#mc-prog", "#mc-fonte"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);

      // câmera: centraliza o ponto (cx, cy) da gravação com zoom z (1 = gravação inteira na moldura)
      const cam = (cx, cy, z) => { const k = (1600 / 1920) * z; return { scale: k, x: 800 - cx * k, y: 414 - cy * k }; };
      tl.set("#mc-cam", cam(960, 497, 1), 0);

      // etapas: [início, fim] de cada título; a barra acende a etapa atual e marca as anteriores em verde
      const ETAPAS = [0.1, 6.5, 13.0, 19.0];
      for (let i = 0; i < 3; i++) {
        const a = ETAPAS[i], b = ETAPAS[i + 1];
        tl.fromTo(`#mc-t${i + 1}`, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, a);
        tl.to(`#mc-t${i + 1}`, { opacity: 0, duration: 0.2 }, b - 0.2);
        tl.to(`#mc-p${i + 1}`, { backgroundColor: "#ffb020", borderColor: "#ffb020", color: "#1a1205", scale: 1.18, duration: 0.3, ease: "back.out(2.5)" }, a + 0.05);
        if (i < 2) tl.to(`#mc-p${i + 1}`, { backgroundColor: "#1f8a5b", borderColor: "#34d399", color: "#ffffff", scale: 1, duration: 0.25 }, b);
      }

      // recursos reutilizáveis
      const foco = (id, a, b) => { tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.25 }, a); tl.to(id, { opacity: 0, duration: 0.25 }, b); };
      const clique = (id, t) => { tl.set(id, { opacity: 1, scale: 0.4 }, t); tl.to(id, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out" }, t); };
      const destaque = (id, a, b, itens = []) => {
        tl.to("#mc-fonte", { opacity: 0, duration: 0.2 }, a - 0.2);
        tl.fromTo(id, { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, a);
        itens.forEach((t, k) => tl.to(`${id} i:nth-of-type(${k + 1})`, { opacity: 1, scale: 1.06, duration: 0.2, ease: "back.out(2.5)" }, t));
        tl.to(id, { opacity: 0, duration: 0.25 }, b);
        tl.to("#mc-fonte", { opacity: 1, duration: 0.3 }, b + 0.3);
      };

      // etapa 1: zoom na barra de botões, foco, clique e destaque
      tl.to("#mc-cam", { ...cam(560, 180, 2.0), duration: 1.3, ease: "power2.inOut" }, 0.8);
      foco("#mc-f1", 2.2, 6.2); clique("#mc-c1", 2.8);
      destaque("#mc-r1", 2.4, 6.2, [2.7, 3.6, 4.5]);
      // etapa 2: zoom no formulário
      tl.to("#mc-cam", { ...cam(860, 500, 1.35), duration: 1.1, ease: "power2.inOut" }, 6.4);
      foco("#mc-f2", 7.6, 10.6); foco("#mc-f3", 10.4, 12.6); clique("#mc-c2", 11.0);
      destaque("#mc-r2", 7.6, 12.6, [7.9, 9.2, 10.6]);
      // etapa 3: volta à tela inteira e abre o cartão-resumo
      tl.to("#mc-cam", { ...cam(960, 497, 1), duration: 0.9, ease: "power2.inOut" }, 12.8);
      tl.to(["#mc-tela", "#mc-prog"], { opacity: 0, duration: 0.4 }, 13.3);
      tl.fromTo("#mc-resumo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 13.4);
      [13.8, 14.6, 15.4].forEach((t, i) => tl.fromTo(`#mc-k${i + 1}`, { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, t));
      tl.to("#mc-cena", { opacity: 0, duration: 0.3, ease: "power1.in" }, 19.0);
      window.__timelines["cena"] = tl;
    })();
  </script>
</template>
